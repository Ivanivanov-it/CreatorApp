<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Server Error - 500</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background-color: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            max-width: 600px;
        }
        .display-1 {
            font-size: 6rem;
            font-weight: 800;
            color: #ff5555;
            text-shadow: 0 0 20px rgba(255, 85, 85, 0.4);
            margin-bottom: 0;
        }
        .fs-3 {
            color: #8be9fd;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .lead {
            color: #a0a0a0;
            margin-bottom: 2rem;
        }
        .btn-game-primary {
            background-color: #ff79c6;
            border-color: #ff79c6;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0.8rem 2.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            border-radius: 5px;
        }
        .btn-game-primary:hover {
            background-color: #ff92d0;
            border-color: #ff92d0;
            box-shadow: 0 0 15px rgba(255, 121, 198, 0.6);
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="display-1">500</h1>
        <div class="fs-3">Critical Error!</div>
        <p class="lead">
            Something went wrong on our side. The server encountered an internal error and was unable to complete your request.
        </p>
        <p class="small text-muted mb-4">
            Our team of high-level developers has been notified.
        </p>
        <a href="/" class="btn-game-primary">Back to Safety</a>
    </div>
</body>
</html>
