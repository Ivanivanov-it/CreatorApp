<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>{% block title %} {{ page_title }} {% endblock %}</title>
</head>
<body>

<header class="navbar bg-primary navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'characters:home' %}">Character Hub</a>
    </div>

    <nav class="d-flex gap-3">
        <a class="nav-link text-white" href="{% url 'characters:list' %}">Characters</a>
        <a class="nav-link text-white" href="{% url 'partners:list' %}">Partners</a>
        <a class="nav-link text-white me-3" href="{% url 'reviews:recent' %}">Recent reviews</a>
    </nav>

</header>

<main class="container my-4">
    {% block content %}
    {% endblock %}
</main>



</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
