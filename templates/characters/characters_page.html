{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="my-4">Characters</h1>
    <a href="{% url 'characters:create_character' %}" class="btn btn-primary mb-3">Create New Character</a>
    <div class="row">
        {% for character in characters %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ character.name }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ character.title }}</h6>
                    <a href="{% url 'characters:character_detail' character.pk %}" class="btn btn-primary">Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
