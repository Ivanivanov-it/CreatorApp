{% extends 'base.html' %}
{% load static %}

{% block title %}Method Not Allowed - 405{% endblock %}

{% block content %}
<style>
    body {
        background-color: #1a1a2e; /* Dark background for game feel */
        color: #e0e0e0; /* Light text for contrast */
    }
</style>
<div class="d-flex align-items-center justify-content-center text-center py-5" style="min-height: calc(100vh - 150px);">
    <div class="container">
        <h1 class="display-1 fw-bold text-warning">405</h1>
        <p class="fs-3"> <span class="text-warning">Wait!</span> Method Not Allowed.</p>

            The action you are trying to perform is not permitted on this resource.
        </p>
        <a href="{% url 'common:home' %}" class="btn btn-game-primary btn-lg mt-3">Go to Home</a>
    </div>
</div>
{% endblock %}
